spring:
  application:
    name: config-service
  profiles:
    # "native" serves the bundled config-repo/ folder. Switch to "git" (and set
    # CONFIG_GIT_URI / GIT_USERNAME / GIT_PASSWORD) to serve an external repo instead.
    active: ${CONFIG_BACKEND:native}
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_NATIVE_LOCATIONS:classpath:/config-repo}
        git:
          uri: ${CONFIG_GIT_URI:}
          username: ${GIT_USERNAME:}
          password: ${GIT_PASSWORD:}
          default-label: main
          clone-on-start: true

server:
  port: 8888

eureka:
  client:
    enabled: false
