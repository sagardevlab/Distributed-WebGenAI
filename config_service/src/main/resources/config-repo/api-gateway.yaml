server:
  port: 8080

app:
  security:
    public-routes:
      - /account/auth/**
      - /account/webhooks/**
      - /actuator/**
      - /*/actuator/**
  cors:
    # Comma-separated list of origins allowed to call the API from a browser.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://sagardevlab.in,https://sagardevlab.in,http://www.sagardevlab.in,https://www.sagardevlab.in}

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: account-service
              uri: ${ACCOUNT_SERVICE_URI}
              predicates:
                - Path=/account/**
            - id: workspace-service
              uri: ${WORKSPACE_SERVICE_URI}
              predicates:
                - Path=/workspace/**
            - id: intelligence-service
              uri: ${INTELLIGENCE_SERVICE_URI}
              predicates:
                - Path=/intelligence/**
