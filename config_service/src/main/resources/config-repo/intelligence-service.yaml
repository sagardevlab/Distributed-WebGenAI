server:
  port: 9030
  servlet:
    context-path: /intelligence

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/intelligence_db
    username: intelligence_user
    password: ${DB_PASSWORD:intelligence_pass}
  ai:
    model:
      # Which chat model backs the code generator: "anthropic" (default) or "openai"
      chat: ${AI_PROVIDER:anthropic}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:missing-anthropic-api-key}
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-opus-5}
          # Generated files can be long; responses are streamed, so a high ceiling is safe.
          # Do not set temperature/top-p: current Claude models reject sampling parameters.
          max-tokens: 64000
    openai:
      # Any OpenAI-compatible endpoint works (OpenAI, OpenRouter, Groq, a local Ollama, ...).
      api-key: ${AI_API_KEY:missing-api-key}
      base-url: ${AI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${AI_MODEL:gpt-4.1}
          temperature: 0.4
          stream-usage: true
  mvc:
    async:
      request-timeout: 600000
