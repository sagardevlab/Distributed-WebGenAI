server:
  port: 9020
  servlet:
    context-path: /workspace

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/workspace_db
    username: workspace_user
    password: ${DB_PASSWORD:workspace_pass}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:minio}
  secret-key: ${MINIO_ROOT_PASSWORD:minio-password}
  project-bucket: projects
  template-bucket: starter-projects

app:
  preview:
    # "local" runs `npm run dev` on this machine; "k8s" claims a pod from the runner pool.
    mode: ${PREVIEW_MODE:local}
    local-dir: ${PREVIEW_LOCAL_DIR:${java.io.tmpdir}/webgenai-previews}
    local-base-port: 5200
    namespace: ${PREVIEW_NAMESPACE:webgenai-previews}
    domain: ${PREVIEW_DOMAIN:previews.localhost}
    proxy-port: ${PROXY_PORT:80}
